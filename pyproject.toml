[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metabotarget"
version = "0.2.0"
description = "Autonomous Multi-Scale Target-Based Drug Discovery & Translational AI Platform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "MetaBioTarget Engineering", email = "research@metabotarget.ai" }
]
keywords = [
    "drug-discovery",
    "computational-biology",
    "meta-learning",
    "pharmacokinetics",
    "pbpk",
    "uniprot",
    "open-targets"
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "requests>=2.28.0",
    "matplotlib>=3.5.0",
    "networkx>=2.8.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0"
]

[project.scripts]
metabotarget = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
